name: Build Debian 12 NFS Desktop ISO

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional tag name to publish ISO release (e.g. v1.0.0)"
        required: false
        default: ""

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Maximize free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Restore cached Debian 12 base & APT packages
        uses: actions/cache@v5
        with:
          path: .lb-cache
          key: debian-12-lb-cache-v3-${{ hashFiles('live-build/config/package-lists/nfs-desktop.list.chroot') }}
          restore-keys: |
            debian-12-lb-cache-v3-

      - name: Keep only the latest cache entry
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_KEY: debian-12-lb-cache-v3-${{ hashFiles('live-build/config/package-lists/nfs-desktop.list.chroot') }}
        run: |
          python3 - <<'PY' || true
          import json, os, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          keep = os.environ["KEEP_KEY"]
          headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"}
          req = urllib.request.Request(f"https://api.github.com/repos/{repo}/actions/caches?per_page=100", headers=headers)
          with urllib.request.urlopen(req, timeout=15) as r:
              caches = json.load(r).get("actions_caches", [])
          for c in caches:
              if c.get("key") != keep:
                  dreq = urllib.request.Request(f"https://api.github.com/repos/{repo}/actions/caches/{c['id']}", headers=headers, method="DELETE")
                  urllib.request.urlopen(dreq, timeout=15).read()
                  print(f"Deleted old cache: {c.get('key')}")
          PY

      - name: Build .deb packages from src/ & Verify all .deb packages
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" -w /work debian:bookworm bash -c '
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends gcc make libglib2.0-dev pkg-config dpkg-dev binutils python3
            chmod +x src/taskbar/build.sh
            ./src/taskbar/build.sh
            count=0
            for deb in repo/pool/main/*.deb build/debs/*.deb; do
              [ -e "$deb" ] || continue
              dpkg-deb --info "$deb" >/dev/null
              dpkg-deb --contents "$deb" >/dev/null
              count=$((count + 1))
            done
            echo "Verified ${count} .deb packages successfully."
          '

      - name: Build Debian 12 Live ISO via live-build in Debian Bookworm container
        run: |
          chmod +x live-build/build.sh
          docker run --privileged --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            debian:bookworm \
            bash -c '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                live-build \
                debootstrap \
                squashfs-tools \
                xorriso \
                isolinux \
                syslinux-common \
                grub-pc-bin \
                grub-efi-amd64-bin \
                dosfstools \
                mtools \
                cpio \
                xz-utils \
                zstd \
                dpkg-dev \
                apt-utils \
                gcc \
                make \
                libglib2.0-dev \
                python3 \
                ca-certificates
              mkdir -p out
              chmod +x src/taskbar/build.sh
              ./src/taskbar/build.sh 2>&1 | tee out/build.log
              ./live-build/build.sh 2>&1 | tee -a out/build.log
            '

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: out/build.log
          retention-days: 7

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v7
        with:
          name: nfs-desktop-amd64-iso
          path: out/*.iso
          retention-days: 14

      - name: Upload SHA256 artifact
        uses: actions/upload-artifact@v7
        with:
          name: nfs-desktop-amd64-sha256
          path: out/*.sha256
          retention-days: 14

      - name: Publish GitHub Release (when release_tag provided)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: "Debian 12 NFS Desktop (${{ inputs.release_tag }})"
          files: |
            out/*.iso
            out/*.sha256
