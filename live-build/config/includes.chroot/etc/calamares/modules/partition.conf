defaultFileSystemType: ext4

# Use a swap file so Calamares does not append a partition at the end of the disk.
userSwapChoices: [file, none]
initialSwapChoice: file

# Bookworm's partitioning backend can overestimate the end of a new GPT disk.
# Calamares 3.2 takes whole percentages, so leave the last 1% outside the layout.
partitionLayout:
  - name: "VOS OS"
    filesystem: ext4
    mountPoint: /
    size: 99%
